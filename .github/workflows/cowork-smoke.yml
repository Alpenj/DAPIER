name: Cowork smoke tests

on:
  push:
    branches:
      - "pro/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hardware-free-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke-test dependency
        run: python3 -m pip install "numpy>=2,<3"
      - name: Run sim-first unit tests
        run: python3 -m unittest discover -s dapier_sim_first/test -v
      - name: Run casino dealer unit tests
        working-directory: casino_dealer
        run: python3 -m unittest discover -s test -v
