render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [dapier-dual-so101]
language_num: 1
eval_instruction: seen
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: DAPIER_H201
  wrist_camera_type: DAPIER_WRIST
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: true
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
pregrasp_clearance_m: 0.12
grasp_height_offset_m: 0.02
# Residual jaw-center calibration; zero uses the generated grasp link.
grasp_lateral_offset_m: 0.02
# 30 mm diameter rod: contact-holding aperture, not a fully closed command.
grasp_gripper_position: 0.22
min_approach_alignment: 0.45
min_jaw_axis_alignment: 0.35
